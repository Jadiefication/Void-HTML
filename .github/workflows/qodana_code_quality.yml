name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - Main

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana Scan (Community)
        uses: JetBrains/qodana-action@v2025.2
        with:
          args: --linter,qodana-jvm-community
